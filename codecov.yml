# Codecov Configuration for HexNil
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        # Require 100% coverage
        target: 100%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 100%
        threshold: 0%
        informational: false

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: no
  require_base: no
  require_head: yes

# Files to ignore from coverage reporting (already handled in .coveragerc)
ignore:
  - "backend/hexnil_fastapi_server.py"
  - "backend/hexnil_ai_pipeline.py"
  - "analyze_*.py"
  - "check_*.py"
  - "apply_*.py"
  - "snapshot_*.py"
  - "inspect_*.py"
  - "query_*.py"
  - "run_*.py"
  - "smoke_test_pipeline.py"
  - "hexnil_auto_sync.py"
  - "setup_database.py"
  - "test_*.py"
  - "**/test_*.py"
  - "tests/**"
  - "conftest.py"
