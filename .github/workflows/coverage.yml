name: Codecov Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    env:
      HEXNIL_DB_HOST: 127.0.0.1
      HEXNIL_DB_PORT: 3306
      HEXNIL_DB_NAME: hexnil
      HEXNIL_DB_USER: hexnil_backend
      HEXNIL_DB_PASSWORD: HexNil_Backend_2026!
      HEXNIL_AI_USER: hexnil_ai
      HEXNIL_AI_PASSWORD: HexNil_AI_2026!

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hexnil
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov requests

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h "127.0.0.1" -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 5
          done

      - name: Setup database schema
        env:
          HEXNIL_SETUP_USER: root
          HEXNIL_SETUP_PASSWORD: root
        run: |
          python setup_database.py

      - name: Start FastAPI backend
        run: |
          nohup python run_hexnil_backend.py &
          sleep 10

      - name: Run tests with coverage
        run: |
          pytest --cov --cov-branch --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.Codecove }}
